<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Subagencias">
  <defs>
    <linearGradient id="agcA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="agcB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#d6da09"/>
    </linearGradient>
    <linearGradient id="agcC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/><stop offset="1" stop-color="#263143"/>
    </linearGradient>
    <filter id="agcS" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity=".28"/>
