  </defs>
  <!-- edificio central (SEP) -->
  <rect x="44" y="22" width="40" height="82" rx="6" fill="url(#agcA)" filter="url(#agcS)"/>
  <g fill="#dbeafe" opacity=".95">
    <rect x="52" y="32" width="9" height="9" rx="2"/><rect x="67" y="32" width="9" height="9" rx="2"/>
    <rect x="52" y="48" width="9" height="9" rx="2"/><rect x="67" y="48" width="9" height="9" rx="2"/>
    <rect x="52" y="64" width="9" height="9" rx="2"/><rect x="67" y="64" width="9" height="9" rx="2"/>
  </g>
  <rect x="57" y="82" width="14" height="22" rx="3" fill="#1e3a8a"/>
  <!-- bandera -->
  <rect x="62.5" y="8" width="3" height="16" rx="1.5" fill="#263143"/>
  <path d="M65.5 9 L82 13.5 L65.5 18 Z" fill="url(#agcB)"/>
  <!-- agencias a los lados -->
  <rect x="12" y="52" width="30" height="52" rx="5" fill="url(#agcC)" filter="url(#agcS)"/>
  <rect x="86" y="52" width="30" height="52" rx="5" fill="url(#agcC)" filter="url(#agcS)"/>
  <g fill="url(#agcB)">
    <rect x="19" y="61" width="7" height="7" rx="1.5"/><rect x="29" y="61" width="7" height="7" rx="1.5"/>
    <rect x="19" y="74" width="7" height="7" rx="1.5"/><rect x="29" y="74" width="7" height="7" rx="1.5"/>
    <rect x="93" y="61" width="7" height="7" rx="1.5"/><rect x="103" y="61" width="7" height="7" rx="1.5"/>
    <rect x="93" y="74" width="7" height="7" rx="1.5"/><rect x="103" y="74" width="7" height="7" rx="1.5"/>
  </g>
  <!-- suelo -->
  <rect x="6" y="104" width="116" height="8" rx="4" fill="#263143" opacity=".85"/>
