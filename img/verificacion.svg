<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Verificación Académica">
  <defs>
    <linearGradient id="vaDoc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8eef7"/>
    </linearGradient>
    <linearGradient id="vaCap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="vaLupa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="vaVidrio" cx=".35" cy=".35" r=".7">
      <stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#7dd3fc"/>
    </radialGradient>
    <filter id="vaSombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
  </defs>
  <!-- certificado -->
  <g filter="url(#vaSombra)">
    <rect x="22" y="40" width="86" height="104" rx="10" fill="url(#vaDoc)" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="36" y="62" width="58" height="7" rx="3.5" fill="#93c5fd"/>
    <rect x="36" y="78" width="46" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="36" y="91" width="52" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="36" y="104" width="38" height="6" rx="3" fill="#cbd5e1"/>
    <circle cx="44" cy="126" r="8" fill="#16a34a"/>
    <path d="M40 126l3 3 5-6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- birrete -->
  <g filter="url(#vaSombra)">
    <path d="M64 30 L108 14 L152 30 L108 46 Z" fill="url(#vaCap)"/>
    <path d="M84 37 v14 c0 7 11 12 24 12 s24-5 24-12 v-14 l-24 9 z" fill="#1d4ed8"/>
    <path d="M144 32 v20" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="144" cy="55" r="4" fill="#fbbf24"/>
  </g>
  <!-- lupa -->
  <g filter="url(#vaSombra)">
    <path d="M128 128 L148 148" stroke="url(#vaLupa)" stroke-width="12" stroke-linecap="round"/>
    <circle cx="112" cy="110" r="26" fill="url(#vaVidrio)" stroke="url(#vaLupa)" stroke-width="8"/>
    <path d="M100 100 a14 14 0 0 1 14 -6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  </g>
</svg>
