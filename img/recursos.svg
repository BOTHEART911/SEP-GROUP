<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Recursos">
  <defs>
    <linearGradient id="rcsA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="rcsB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#d6da09"/>
    </linearGradient>
    <linearGradient id="rcsC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="rcsS" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#0f172a" flood-opacity=".28"/>
    </filter>
  </defs>
  <!-- tarjetas apiladas (la biblioteca de recursos) -->
  <rect x="26" y="20" width="84" height="56" rx="10" fill="#93c5fd" transform="rotate(-8 68 48)" filter="url(#rcsS)"/>
  <rect x="20" y="28" width="88" height="60" rx="11" fill="#60a5fa" transform="rotate(-3 64 58)" filter="url(#rcsS)"/>
  <!-- la pantalla del video -->
  <rect x="14" y="36" width="92" height="64" rx="12" fill="url(#rcsA)" filter="url(#rcsS)"/>
  <rect x="20" y="42" width="80" height="44" rx="8" fill="#0f172a" opacity=".25"/>
  <!-- botón de reproducir -->
  <circle cx="60" cy="64" r="17" fill="url(#rcsC)"/>
  <path d="M55 55.5 L71 64 L55 72.5 Z" fill="#1e40af"/>
  <!-- barra de progreso -->
  <rect x="20" y="90" width="80" height="4" rx="2" fill="#bfdbfe"/>
  <rect x="20" y="90" width="34" height="4" rx="2" fill="url(#rcsB)"/>
  <!-- etiqueta de información -->
  <circle cx="104" cy="98" r="15" fill="url(#rcsB)" filter="url(#rcsS)"/>
  <rect x="102" y="96" width="4" height="10" rx="2" fill="#263143"/>
  <circle cx="104" cy="91" r="2.4" fill="#263143"/>
</svg>
